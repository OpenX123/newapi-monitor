services:
  newapi-monitor:
    image: ghcr.io/your-username/newapi-monitor:latest
    # build: .  # 本地构建时取消注释
    container_name: newapi-monitor
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      - NEWAPI_BASE_URL=https://your-newapi-domain.com
      - NEWAPI_ACCESS_TOKEN=your_access_token
      - NEWAPI_USER_ID=1
      - DATABASE_URL=postgres://user:password@host:5432/newapi
      - DAILY_LIMIT=2000
      - POLL_INTERVAL=300000
      - PORT=3456
      # Redis（可选，推荐）
      # - REDIS_HOST=127.0.0.1
      # - REDIS_PORT=6379
      # - REDIS_PASSWORD=
      # - REDIS_DB=0
      # - REDIS_KEY_PREFIX=newapi-monitor
      # - CACHE_TTL_SECONDS=120

      # 面板访问密钥（建议改成一个足够长的随机字符串）
      # - DASHBOARD_ACCESS_KEY=change_to_a_long_random_secret
      # SMTP（可选）
      # - SMTP_HOST=smtp.qq.com
      # - SMTP_PORT=587
      # - SMTP_USER=your_email@qq.com
      # - SMTP_PASS=your_smtp_password
