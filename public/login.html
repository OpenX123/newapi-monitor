<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · NewAPI Monitor</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#101521;color:#edf2ff}main{width:min(360px,calc(100% - 40px));padding:32px;border:1px solid #2b3854;border-radius:14px;background:#182033}p{color:#a9b5cb}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;font:inherit}input{border:1px solid #3b4a69;background:#0e1420;color:inherit}button{margin-top:16px;border:0;background:#4d8dff;color:#fff}#error{min-height:20px;margin-top:12px;color:#ff8896;font-size:13px}</style></head><body><main><h1>NewAPI Monitor</h1><p>请输入面板访问密钥。</p><form id="form"><input id="key" type="password" autocomplete="current-password" required autofocus><button id="submit">登录</button><div id="error"></div></form></main><script>const loginForm=document.getElementById('form'),keyInput=document.getElementById('key'),submitButton=document.getElementById('submit'),errorBox=document.getElementById('error');loginForm.addEventListener('submit',async e=>{e.preventDefault();submitButton.disabled=true;errorBox.textContent='';try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessKey:keyInput.value})}),d=await r.json();if(!r.ok)throw Error(d.message||'登录失败');location.replace('/')}catch(e){errorBox.textContent=e.message}finally{submitButton.disabled=false}})</script></body></html>
